h1{font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin-bottom:14px;max-width:1150px}
.sub{font-size:18px;line-height:1.4;color:var(--ink2);max-width:1100px;margin-bottom:16px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.chip b{display:block;font-size:26px;line-height:1.1}
.chip span{font-size:14px;color:var(--mut)}
.chip.h b{color:var(--red)}.chip.r b{color:#C9711A}.chip.u b{color:#B27F0E}.chip.o b{color:var(--ok)}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(82vh,880px);min-height:560px;touch-action:none}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.land path{stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke}
.geo{font-weight:700;letter-spacing:.3em;fill:#A8A296;text-anchor:middle;pointer-events:none}
.ringl{fill:none;stroke:#7F93D9;stroke-width:1.2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.ringt{font-size:13px;font-weight:500;fill:#5A6FC4;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.mk{cursor:pointer}
.lab{pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.88);stroke-width:4px;stroke-linejoin:round}
.lab .n{font-weight:700;font-size:15px;fill:var(--ink)}
.lab .s{font-weight:500;font-size:13px}
.ctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btns{display:flex;gap:6px}
.btn{font:500 14px eU,Arial,sans-serif;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#999}
.tog{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:5px}
.tog label{display:flex;gap:7px;align-items:center;cursor:pointer}
.card{position:absolute;left:10px;bottom:10px;width:min(360px,calc(100% - 20px));background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px;font-size:14px;line-height:1.4;display:none;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.card h3{font-size:19px;margin-bottom:2px;padding-right:22px}
.card .x{position:absolute;right:10px;top:8px;cursor:pointer;font-size:20px;color:var(--mut);line-height:1}
.card .m{color:var(--mut);margin-bottom:8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.card dt{color:var(--mut)}.card p{margin-top:8px;color:var(--ink2)}
.card a{color:var(--blue)}
.badge{display:inline-block;border-radius:20px;padding:1px 9px;font-size:13px;font-weight:500;color:#fff;white-space:nowrap}
.b-halted{background:var(--red)}.b-reduced{background:#C9711A}.b-hit_unconfirmed{background:#B27F0E}.b-operating{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin:0 2px 12px;font-size:15px}
.legend .it{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.legend .it.off{opacity:.35}
.legend svg{flex:none}
.legend .sz{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);line-height:1.5;margin:10px 2px 18px;max-width:1200px}
.dd{margin-top:18px}.dd summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--ink2)}
.tbar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px;gap:12px;flex-wrap:wrap}
.tbar h2{font-size:24px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:#F8F6F1;cursor:pointer;white-space:nowrap;position:sticky;top:0}
th:hover{color:var(--blue)}
td.num,th.num{text-align:right}
tbody tr{cursor:pointer}tbody tr:hover{background:#F4F6FE}
tbody tr.sel{background:#E9EEFF}
.src{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:var(--mut);line-height:1.45;border-top:1px solid var(--line);padding-top:12px;margin-top:22px;gap:20px}
.brand{flex:none;line-height:0}.brand svg{height:14px;width:auto;display:block}
@media(max-width:700px){.src{flex-direction:column;align-items:flex-start}.brand svg{height:12px}h1{font-size:28px}.sub{font-size:16px}body{padding:20px 14px}}
.emb .mapbox{height:min(56vw,760px);min-height:420px}
@media(max-width:700px){
 body{padding:16px 12px 20px}
 h1{font-size:22px;margin-bottom:8px}
 .sub{font-size:14px;margin-bottom:10px}
 .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;margin-bottom:10px}
 .legend .it{gap:6px}.legend .it svg{width:22px;height:22px}
 .legend .sz{grid-column:1/-1;font-size:13px;gap:6px}
 .mapbox,.emb .mapbox{height:150vw;min-height:460px;max-height:720px}
 .ctl{top:8px;right:8px;gap:5px}.btn{padding:6px 9px;font-size:13px}
 .tog{font-size:12px;padding:5px 8px;gap:2px}
 .card{left:8px;bottom:8px;width:calc(100% - 16px);font-size:13px;padding:10px 12px}
 .card h3{font-size:17px}
 .note{font-size:12px}}
@media(pointer:coarse){.mapbox,svg#map{touch-action:pan-y}}
.static .ctl,.static .card,.static .clk{display:none!important}
.static .wrap{max-width:1500px}
.static .mapbox{width:1500px;height:800px;max-width:none;min-height:0;pointer-events:none}
